version: '3.8'

services:
  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: invest-agent-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/invest.db
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_MODE_ENABLED=true
      - KNOWLEDGE_BASE_PATH=/app/knowledge
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./knowledge:/app/knowledge:ro
      - ./.env:/app/.env:ro
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - invest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invest-agent-frontend
    command: ["streamlit", "run", "app/frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - invest-network

  # Database Service (optional for future PostgreSQL migration)
  db:
    image: postgres:16-alpine
    container_name: invest-agent-db
    environment:
      - POSTGRES_USER=${DB_USER:-investuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-investpass}
      - POSTGRES_DB=${DB_NAME:-investdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - invest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-investuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional, for future caching layer)
  redis:
    image: redis:7-alpine
    container_name: invest-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - invest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: invest-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - invest-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  invest-network:
    driver: bridge
